name: REA automatic CI rollback

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: write
  issues: write

concurrency:
  group: rea-automatic-rollback
  cancel-in-progress: false

jobs:
  rollback:
    name: Restore previous version after failed post-sync CI
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.event == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Check whether this failure belongs to latest sync
        id: verify
        shell: bash
        env:
          CI_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          git fetch origin main
          head_sha=$(git rev-parse origin/main)
          if [[ "$head_sha" != "$CI_SHA" ]]; then
            echo "Main has moved since this test: no rollback." >> "$GITHUB_STEP_SUMMARY"
            echo "restore=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          subject=$(git show -s --format=%s "$head_sha")
          parents=$(git show -s --format=%P "$head_sha")
          parent_count=$(wc -w <<< "$parents")
          # Support both legacy two-parent merges and the new one-parent
          # upstream-source sync commits (which intentionally exclude
          # GitHub Actions workflow files to avoid extra token privileges).
          if [[ "$subject" == "chore(sync): merge morluto/rea main" && "$parent_count" -eq 2 ]]; then
            echo "revert_args=-m 1" >> "$GITHUB_OUTPUT"
          elif [[ "$subject" == chore\(sync\):\ update\ REA\ source\ from\ morluto/rea\ \(* && "$parent_count" -eq 1 ]]; then
            echo "revert_args=" >> "$GITHUB_OUTPUT"
          else
            echo "CI did not test the latest automated REA sync commit: no rollback." >> "$GITHUB_STEP_SUMMARY"
            echo "restore=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "restore=true" >> "$GITHUB_OUTPUT"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"

      - name: Restore pre-sync tree, retain failed revision
        if: steps.verify.outputs.restore == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          FAILED_CI_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          failed_sha=$(git rev-parse HEAD)
          first_parent=$(git rev-parse HEAD^1)
          failed_backup="backup/failed-ci-$GITHUB_RUN_ID"
          git branch "$failed_backup" "$failed_sha"

          # Undo only the latest sync, preserving complete Git history.
          # A legacy two-parent merge requires -m 1; a newer one-parent
          # source-update commit must be reverted without -m.
          if [[ "${{ steps.verify.outputs.revert_args }}" == "-m 1" ]]; then
            git revert --no-edit -m 1 "$failed_sha"
          else
            git revert --no-edit "$failed_sha"
          fi
          if ! git diff --quiet "$first_parent" HEAD; then
            echo "::error::Reverted code does not match the pre-sync tree. Refusing to push."
            exit 1
          fi
          # A tracked freeze marker prevents repeatedly resyncing a
          # rejected upstream version, even when GitHub Issues are disabled.
          printf 'CI failed for upstream merge: %s\nReview before removing this marker.\n' "$failed_sha" > .rea-sync-frozen
          git add .rea-sync-frozen
          git commit -m "chore(sync): freeze after automatic CI rollback"
          auth_header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w 0)"
          git -c "http.https://github.com/.extraheader=$auth_header" push origin "$failed_backup"
          git -c "http.https://github.com/.extraheader=$auth_header" push origin HEAD:refs/heads/main

          {
            echo "## Rolled back after failed post-sync CI"
            echo "Failed revision: $failed_sha"
            echo "Pre-sync code restored from $first_parent via revert commit."
            echo "Failed revision kept at $failed_backup."
          } >> "$GITHUB_STEP_SUMMARY"
          gh issue create \
            --title "REA 自动回退：上游同步后 CI 失败" \
            --body "$(printf '已自动将 main 的代码恢复到同步前状态，并保留出错版本 %s。\n故障 CI：%s\n请等待每日更新管家分析，暂勿自动重新同步。\n' "$failed_backup" "$FAILED_CI_URL")" || true
