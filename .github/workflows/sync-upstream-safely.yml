name: Weekly REA upstream sync

on:
  schedule:
    # Sundays 11:17 Beijing time (03:17 UTC).
    - cron: "17 3 * * 0"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-rea-upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Update main from upstream
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout fork with full history
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Apply new upstream source changes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/morluto/rea.git
          git fetch --no-tags upstream main

          previous=$(tr -d '\r\n' < .rea-upstream-sha)
          current=$(git rev-parse upstream/main)
          if [[ "$previous" == "$current" ]]; then
            echo "Already up to date with upstream." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Stop on rewritten upstream history or missing base; never force-push.
          git merge-base --is-ancestor "$previous" upstream/main

          # Preserve our own Actions workflows and the permanent backup branch.
          # Standard GITHUB_TOKEN pushes cannot update workflow definitions.
          patch="$RUNNER_TEMP/rea-weekly-source.patch"
          git diff --binary "$previous" upstream/main -- . \
            ':(exclude).github/workflows/**' \
            ':(exclude).github/actions/**' > "$patch"
          if [[ -s "$patch" ]]; then
            git apply --3way --index "$patch"
          fi

          printf '%s\n' "$current" > .rea-upstream-sha
          git add .rea-upstream-sha
          git diff --cached --check
          git commit -m "chore(sync): weekly REA source update ($current)"
          auth_header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w 0)"
          git -c "http.https://github.com/.extraheader=$auth_header" push origin HEAD:refs/heads/main

          {
            echo "## Weekly upstream sync completed"
            echo "Upstream: $current"
            echo "Changes saved as a normal reversible Git commit."
            echo "No CI, release, or rollback triggered by this sync."
            echo "Permanent backup-before-sync-2026-10-11 was not modified."
          } >> "$GITHUB_STEP_SUMMARY"
